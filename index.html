}

<script>
(function(){

  }
  var PLAY='<svg class="icon fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>';
  var PAUSE='<svg class="icon fill" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>';
  var CROWN='<svg class="crown" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>';
  var LOGO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="rgba(255,255,255,.2)" d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66"/><path d="m18 15-2-2"/><path d="m15 18-2-2"/></svg>';
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  function $(id){return document.getElementById(id)}
  function rnd(n){return Math.floor(Math.random()*n)}

  /* Sample data (prototype only) */
  var PEOPLE=[
    {id:'nila',feel:'Calm',name:'Nila',bio:'Love good conversations with kind people',tags:['Music','Filter coffee','Travel'],on:true,av:5},
    {id:'arun',feel:'Nostalgic',name:'Arun',bio:'Night owl. Cricket, cinema and long walks.',tags:['Cricket','Cinema','Walks'],on:true,av:1},
    {id:'karthik',feel:'Excited',name:'Karthik',bio:'Building things at 2 AM',tags:['Coding','Chai','Podcasts'],on:true,av:3},
    {id:'divya',feel:'Hopeful',name:'Divya',bio:'Dancer, dreamer, daily over-thinker',tags:['Dance','Art','Beach'],on:true,av:6},
    {id:'meena',feel:'Nostalgic',name:'Meena',bio:'Small talk is boring. Tell me your story.',tags:['Books','Poetry','Cooking'],on:false,av:2,seen:'3 min ago'},
    {id:'vijay',feel:'Curious',name:'Vijay',bio:'Here for the laughs',tags:['Comedy','Football','Biryani'],on:false,av:4,seen:'2 days ago'}
  ];
  var THEMES=['Midnight Thoughts','Hometown Memories','Hot Takes','Music Moods','Career Confessions','Friendship Stories'];
  var FEELINGS=['Calm','Excited','Nostalgic','Hopeful','Curious'];
  var ECHOES=[
    {t:'The night I almost quit',feel:'Hopeful',c:'Stories',d:512,av:5,by:'Nila'},
    {t:'Letters to my hometown',feel:'Nostalgic',c:'Stories',d:688,av:2,by:'Meena'},
    {t:'Five minute breathing break',feel:'Calm',c:'Calm',d:300,av:4,by:'Divya'},
    {t:'Rain, filter coffee and old songs',feel:'Nostalgic',c:'Calm',d:742,av:6,by:'Arun'},
    {t:'Worst first dates, ranked',feel:'Excited',c:'Laugh',d:455,av:3,by:'Vijay'},
    {t:'Things I say to autocorrect',feel:'Curious',c:'Laugh',d:390,av:1,by:'Karthik'}
  ];
  var GIFTS=[['🌹','Rose',10],['☕','Chai',20],['🎧','Beats',30],['🔥','Fire',50],['👑','Crown',100]];
  var PACKS=[[50,'₹49'],[120,'₹99'],[300,'₹199'],[700,'₹399']];
  var ISSUES=[['Podcast approval: host a Huddle','host'],['Stories access: publish Echoes','stories'],['App owner access: become a Guardian','guardian'],['Call quality','other'],['Hearts or payment','other'],['Report someone','other'],['Something else','other']];
  var FIRST=['Aarav','Anbu','Bala','Chitra','Deepa','Eswar','Gowri','Hari','Indu','Jeeva','Kavin','Lakshmi','Mani','Nithya','Om','Priya','Ravi','Sangeetha','Tamil','Uma','Varun','Yazhini'];

  var S={authed:false,tab:'home',home:'sparks',spark:0,circle:{karthik:1,meena:1,vijay:1},hearts:240,sub:null,
    tx:[{t:'Welcome gift',a:240,w:'Today'}],recents:[{who:'karthik',m:'video',d:'12:40',w:'Yesterday'},{who:'meena',m:'audio',d:'Missed',w:'Yesterday'}],
    role:'member',ef:'All',tk:'active',preKind:null,phone:'',login:{step:'phone',phone:''},perm:{host:false,stories:false,guardian:false},hosts:['vijay'],
    tickets:[{id:'s1',who:'meena',kind:'host',type:ISSUES[0][0],text:'I want to host a weekly Friendship Stories Huddle.',st:'active',res:null,seen:true},{id:'s2',who:'divya',kind:'stories',type:ISSUES[1][0],text:'I record short poems and want to publish them as Echoes.',st:'active',res:null,seen:true}],cur:0,pos:0,playing:false,speed:1,call:null,modal:null,
    huddles:[
      {id:'h1',theme:'Music Moods',title:'Old Tamil songs, new feelings',host:'Vijay',av:4,count:62},
      {id:'h2',theme:'Midnight Thoughts',title:'Cannot sleep club',host:'Meena',av:2,count:100}
    ]};
  var R=null;
  var view=$('app');
  function person(id){return PEOPLE.filter(function(p){return p.id===id})[0]}
  function avatar(p,extra){return '<span class="av av'+p.av+(extra||'')+'" aria-hidden="true">'+esc(p.name.charAt(0))+'</span>'}
  function heartsPill(){return '<button class="hpill" data-a="shop" aria-label="'+N.hearts+': '+S.hearts+'. Get more">'+ic('heart','fill')+S.hearts+ic('plus')+'</button>'}
  function busy(){return !!S.call||(R&&!R.min)}

  /* ---------- Render ---------- */
  function render(){
    var nav=$('nav');
    if(!S.authed){
      nav.hidden=true;
      var L=S.login,body;
      if(L.step==='phone')body='<div class="loginform"><label for="lgPhone" class="hint">Mobile number</label><div class="phonebox"><span class="cc">+91</span><input id="lgPhone" class="field" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" placeholder="10-digit number" value="'+esc(L.phone)+'"></div><button class="btn block" id="lgSend" data-a="sendOtp" disabled>Send OTP</button><p class="hint">We send a 6-digit code to verify your number. Prototype: no SMS is sent.</p></div>';
      else body='<div class="loginform"><p class="hint" style="font-size:14px">Enter the 6-digit code sent to +91 '+esc(L.phone)+'</p><input id="lgOtp" class="field otp" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······" aria-label="6-digit code"><p class="hint" id="lgErr" style="color:var(--danger)" role="alert"></p><button class="btn block" id="lgVerify" data-a="verify" disabled>Verify and login</button><div class="row between"><button class="linkbtn" data-a="changeNum">Change number</button><button class="linkbtn" data-a="resend">Resend code</button></div><p class="hint">Prototype: use code 123456.</p></div>';
      view.innerHTML='<section class="splash"><span class="logo">'+LOGO+'</span><h1>FeelRight</h1><p class="tag">Feel the connection.</p><div class="trio">Meet • Talk • Connect</div>'+body+'</section>';
      syncLogin();renderMini();return;
    }
    nav.hidden=false;
    var tabs=[['home','Home','home'],['huddles',N.huddles,'users'],['echoes',N.echoes,'head'],['profile','Profile','user']];
    $('tabs').innerHTML=tabs.map(function(t){return '<button data-a="tab" data-v="'+t[0]+'" '+(S.tab===t[0]&&!S.sub?'aria-current="page"':'')+'>'+ic(t[2])+'<span>'+t[1]+'</span></button>'}).join('');
    if(S.tab==='home')view.innerHTML=headerHtml()+homeHtml();
    else if(S.tab==='huddles')view.innerHTML=headerHtml('Huddles')+huddlesHtml();
    else if(S.tab==='echoes')view.innerHTML=headerHtml('Echoes')+echoesHtml();
    else view.innerHTML=S.sub?subHtml():headerHtml('Profile')+profileHtml();
    renderMini();

  function headerHtml(title){
    return '<header class="top">'+(title?'<h1 class="ttl">'+esc(title)+'</h1>':'<div class="brand"><span class="logo sm">'+LOGO+'</span>FeelRight</div>')+heartsPill()+'</header>';
  }
  function subHeader(title){
    return '<header class="top"><div class="row"><button class="iconbtn" data-a="back" aria-label="Back">'+ic('back')+'</button><h1 class="ttl" style="font-size:22px">'+esc(title)+'</h1></div></header>';
  }

  /* Home: Sparks (new people) and Circle (close friends) */
  function homeHtml(){
    var h='<div class="seg" role="group" aria-label="Home sections"><button data-a="htab" data-v="sparks" aria-pressed="'+(S.home==='sparks')+'">'+N.sparks+'</button><button data-a="htab" data-v="circle" aria-pressed="'+(S.home==='circle')+'">'+N.circle+'</button></div>';
    if(S.home==='sparks'){
      var online=PEOPLE.filter(function(p){return p.on});
      var p=online[S.spark%online.length],inC=!!S.circle[p.id];
      var ma=Math.floor(S.hearts/RA),mv=Math.floor(S.hearts/RV);
      h+='<article class="spark s'+p.av+'"><span class="on"><i></i>Online</span>'
        +'<button class="fav" data-a="circle" data-v="'+p.id+'" aria-pressed="'+inC+'" aria-label="'+(inC?'Remove from':'Add to')+' '+N.circle+'">'+ic('heart')+'</button>'
        +'<span class="initial" aria-hidden="true">'+esc(p.name.charAt(0))+'</span>'
        +'<h3>'+esc(p.name)+'</h3><p>'+esc(p.bio)+'</p><div class="chips"><span class="chip" style="background:rgba(255,255,255,.9);color:#15132A;font-weight:600">Feeling '+esc(p.feel)+'</span>'+p.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('')+'</div></article>'
        +'<div class="callrow"><button class="cbig" data-a="call" data-v="'+p.id+':audio" aria-label="Audio call '+esc(p.name)+'">'+ic('phone')+'<small>'+RA+'/min · '+ma+' mins</small></button>'
        +'<button class="cbig" data-a="call" data-v="'+p.id+':video" aria-label="Video call '+esc(p.name)+'">'+ic('video')+'<small>'+RV+'/min · '+mv+' mins</small></button></div>'
        +'<button class="btn ghost block" data-a="next">Show someone else '+ic('next')+'</button>';
    }else{
      var ids=Object.keys(S.circle).filter(function(k){return S.circle[k]});
      h+=ids.length?'<div class="card" style="padding:2px 14px">'+ids.map(function(id){
        var p=person(id);
        return '<div class="person"><span class="av av'+p.av+'">'+esc(p.name.charAt(0))+'<i class="dot'+(p.on?' on':'')+'"></i></span><div class="info"><b>'+esc(p.name)+'</b><span>'+(p.on?'Online now':'Last seen '+esc(p.seen||'recently'))+' · Feeling '+esc(p.feel)+'</span></div>'
          +'<button class="circ" data-a="call" data-v="'+p.id+':audio" '+(p.on?'':'disabled')+' aria-label="Audio call '+esc(p.name)+'">'+ic('phone')+'</button>'
          +'<button class="circ" data-a="call" data-v="'+p.id+':video" '+(p.on?'':'disabled')+' aria-label="Video call '+esc(p.name)+'">'+ic('video')+'</button></div>';
      }).join('')+'</div><p class="hint" style="margin-top:10px">Tap the heart on a '+N.sparks+' card to add someone to your '+N.circle+'.</p>'
      :'<div class="card"><p class="hint">Your '+N.circle+' is empty. Tap the heart on a '+N.sparks+' card to add someone.</p></div>';
    }
    return h;
  }

  /* Huddles: group audio rooms. Hosting needs approval from the Guardian. */
  function stBadge(s){return '<span class="st '+(s==='approved'?'ok':s==='rejected'?'no':'')+'">'+(s==='approved'?'Approved':s==='rejected'?'Not approved':'Pending')+'</span>'}
  function huddleRow(h,guardian){
    var full=h.count>=CAP,btn;
    if(guardian)btn='<button class="btn sm ghost" data-a="endh" data-v="'+h.id+'">End</button>';
    else if(h.mine)btn='<button class="btn sm" data-a="join" data-v="'+h.id+'">Open</button>';
    else if(full)btn='<button class="btn sm" disabled>Full</button>';
    else btn='<button class="btn sm" data-a="join" data-v="'+h.id+'">Join</button>';
    var hp=PEOPLE.filter(function(p){return p.name===h.host})[0];
    return '<div class="person"><span class="cover s'+h.av+'" style="color:#fff">'+esc(h.theme.charAt(0))+'</span><div class="info"><b>'+esc(h.title)+'</b><span>'+esc(h.theme)+' · '+esc(h.host)+'</span>'
      +'<span style="display:block;margin-top:2px"><strong class="pill">Live</strong> <span data-rc="'+h.id+'">'+h.count+'</span> / '+CAP+'</span></div>'+btn+'</div>';
  }
  function myTicket(kind,st){return S.tickets.filter(function(t){return t.who==='me'&&t.kind===kind&&t.st===st}).slice(-1)[0]}
  function huddlesHtml(){
    var h='<div class="seg inline" role="group" aria-label="View as"><button data-a="role" data-v="member" aria-pressed="'+(S.role==='member')+'" style="padding:8px 16px">Member</button><button data-a="role" data-v="guardian" aria-pressed="'+(S.role==='guardian')+'" style="padding:8px 16px">'+N.guardian+'</button></div>'
      +'<p class="hint" style="margin-top:6px">Prototype switch. See the app as a member or as the FeelRight team.</p>';
    if(S.role==='guardian'){
      var n=S.tickets.filter(function(t){return t.st==='active'}).length;
      h+='<h2>Tickets waiting ('+n+')</h2><div class="card stack"><p class="hint">Host approvals, '+N.echoes+' access and '+N.guardian+' access arrive as tickets. Reply with a message when you resolve one.</p><button class="btn sm" data-a="sub" data-v="inbox" style="align-self:flex-start">Open inbox</button></div>'
        +'<h2>Live '+N.huddles+'</h2><div class="card" style="padding:2px 14px">'+(S.huddles.length?S.huddles.map(function(x){return huddleRow(x,true)}).join(''):'<p class="hint" style="padding:14px 0">Nothing is live.</p>')+'</div>'
        +'<h2>Approved hosts</h2><div class="card" style="padding:2px 14px">'+S.hosts.map(function(id){var u=person(id)||{name:'You',av:6};
          return '<div class="person">'+avatar(u)+'<div class="info"><b>'+esc(u.name)+'</b></div>'+stBadge('approved')+'</div>'}).join('')+'</div>';
      return h;
    }
    h+='<h2>Live now</h2><div class="card" style="padding:2px 14px">'+(S.huddles.length?S.huddles.map(function(x){return huddleRow(x,false)}).join(''):'<p class="hint" style="padding:14px 0">No one is live right now.</p>')+'</div>';
    var live=S.huddles.filter(function(x){return x.mine})[0];
    h+='<h2>Host a '+N.huddle+'</h2><div class="card stack">';
    if(S.perm.host){
      h+='<div class="row between"><b>Host access</b>'+stBadge('approved')+'</div>'
        +(live?'<p class="hint">Your '+N.huddle+' is live.</p><button class="btn" data-a="join" data-v="'+live.id+'">Open my '+N.huddle+'</button>'
        :'<p class="hint">The FeelRight team approved you. Start a '+N.huddle+' for up to '+CAP+' people. You decide who speaks.</p><button class="btn" data-a="startHuddle">+ Start '+N.huddle+'</button>');
    }else if(myTicket('host','active')){
      h+='<div class="row between"><b>Host request</b>'+stBadge('pending')+'</div><p class="hint">Your ticket is with the FeelRight team. Their reply will appear in Profile, Help and support.</p>';
    }else{
      var last=myTicket('host','resolved');
      h+='<p class="hint">Only approved hosts can start a '+N.huddle+'. Raise a ticket in Help and support and the FeelRight team will review it.'+(last&&last.res&&!last.res.ok?' Your last request was not approved.':'')+'</p><button class="btn" data-a="raise" data-v="host">Raise a ticket</button>';
    }
    return h+'</div>';
  }
  function themeOptions(sel){return '<option value="">Select a feeling</option>'+THEMES.map(function(t){return '<option'+(sel===t?' selected':'')+'>'+esc(t)+'</option>'}).join('')}

  /* Echoes: short audio stories */
  function echoCard(){
    if(S.perm.stories)return '<div class="card stack" style="margin-bottom:12px"><b>Publish an '+N.echo+'</b><p class="hint">You have creator access. Prototype: no audio is recorded.</p><input class="field" id="echoTitle" maxlength="60" placeholder="Title" aria-label="'+N.echo+' title"><select class="field" id="echoFeel" aria-label="Feeling">'+FEELINGS.map(function(f){return '<option>'+f+'</option>'}).join('')+'</select><button class="btn" data-a="publishEcho">Publish</button></div>';

    return '<div class="card stack" style="margin-bottom:12px"><b>Want to share your own '+N.echoes+'?</b><p class="hint">'+(open?'Your request is with the FeelRight team. Their reply will appear in Help and support.':'Creator access needs approval. Raise a ticket in Help and support.')+'</p>'+(open?'':'<button class="btn sm" data-a="raise" data-v="stories" style="align-self:flex-start">Raise a ticket</button>')+'</div>';

  /* ---------- Calls (simulated, paid per minute) ---------- */
  var ct=null,rt=null;
  function startCall(id,mode){
    if(S.call||R)return;
    var rate=mode==='video'?RV:RA;
    if(S.hearts<rate){toast('Not enough '+N.hearts+'. Open the shop to get more.');return}
    if(S.playing)setPlaying(false);
    var p=person(id);
    S.call={p:p,mode:mode,rate:rate,status:'ringing',secs:0,muted:false,cam:mode==='video'};
    $('call').hidden=false;$('cName').textContent=p.name;$('cEnd').innerHTML=ic('phone');
    drawCall();renderMini();
    var c=S.call;
    rt=setTimeout(function(){
      if(S.call!==c)return;
      spend(c.rate,(mode==='video'?'Video':'Audio')+' call with '+p.name);
      c.status='live';
      ct=setInterval(function(){
        c.secs++;
        if(c.secs%60===0){if(!spend(c.rate,(mode==='video'?'Video':'Audio')+' call with '+p.name)){toast('Out of '+N.hearts);endCall();return}}
        drawStatus();

  var uid=1;

  function openHuddle(h){
    if(!h)return;
    if(R&&R.h.id===h.id){R.min=false;$('room').hidden=false;renderRoom();renderMini();return}
    if(R||S.call){toast('Finish your current '+(S.call?'call':N.huddle)+' first');return}
    if(!h.mine&&h.count>=CAP){toast(N.huddle+' is full ('+CAP+'/'+CAP+')');return}
    if(S.playing)setPlaying(false);
    var people=[];
    if(h.mine)people.push({id:'me',name:'You',av:6,role:'host',muted:false,hand:false});
    else{
      h.count++;
      people.push({id:'host',name:h.host,av:h.av,role:'host',muted:false,hand:false});
      var g=gen(h.count-2);if(g[0]){g[0].role='speaker';g[0].muted=false}
      people=people.concat(g);people.push({id:'me',name:'You',av:6,role:'listener',muted:true,hand:false});
    }
    R={h:h,mine:!!h.mine,people:people,hold:false,min:false,talk:null,hand:false,vol:true};

    $('room').hidden=false;renderRoom();renderMini();

  function tickRoom(){
    if(!R)return;
    var h=R.h,pp=R.people,i;
    if(R.mine){
      var add=Math.min(CAP-pp.length,2+rnd(5));if(add>0)pp.push.apply(pp,gen(add));
      var ls=pp.filter(function(p){return p.role==='listener'&&!p.hand&&p.id!=='me'});
      if(ls.length&&Math.random()<.5)ls[rnd(ls.length)].hand=true;
    }else{
      var d=rnd(5)-2;
      if(d>0&&pp.length<CAP)pp.push.apply(pp,gen(Math.min(d,CAP-pp.length)));
      for(i=0;i<-d;i++){var c=pp.filter(function(p){return p.role==='listener'&&p.id!=='me'});if(c.length)pp.splice(pp.indexOf(c[rnd(c.length)]),1)}
    }

    var sp=pp.filter(function(p){return p.role!=='listener'&&!p.muted});

    el.addEventListener('pointerdown',function(){if(R)R.hold=true});
    function rel(){setTimeout(function(){if(R)R.hold=false},500)}
    el.addEventListener('pointerup',rel);el.addEventListener('pointercancel',rel);
  })();
  function closeRoomUi(){var el=$('room');el.hidden=true;el.innerHTML=''}
  function leaveHuddle(){if(!R)return;clearInterval(R.timer);R.h.count=Math.max(1,R.h.count-1);R=null;closeRoomUi();render()}
  function endHuddle(id){
    S.huddles=S.huddles.filter(function(x){return x.id!==id});
    if(R&&R.h.id===id){clearInterval(R.timer);R=null;closeRoomUi()}
    S.modal=null;renderModal();toast(N.huddle+' ended');render();
  }
  function raiseHand(){
    var y=you();if(!y||y.role!=='listener')return;
    R.hand=!R.hand;y.hand=R.hand;renderRoom();
    if(R.hand){var rr=R;setTimeout(function(){
      if(R===rr&&R.hand&&stageCount()<SLOTS){var y2=you();y2.role='speaker';y2.muted=false;y2.hand=false;R.hand=false;toast('The host let you speak');renderRoom()}
      else if(R===rr&&R.hand){toast('Stage is full. You are on the waitlist.')}
    },3000)}
  }

  /* ---------- Modals ---------- */
  function renderModal(){
    var m=$('modal'),M=S.modal;
    if(!M){m.innerHTML='';return}
    var inner='',mid='';
    if(M.type==='create'){
      inner='<div class="grab"></div><h3>Choose a feeling for your '+N.huddle+'</h3><p class="hint">Pick how you feel today. Your '+N.huddle+' is built around it.</p>'
        +'<select class="field" id="mTheme" aria-label="Feeling theme">'+themeOptions(M.theme)+'</select>'
        +'<input class="field" id="mTitle" maxlength="60" placeholder="Give it a name" aria-label="'+N.huddle+' name">'
        +'<div class="card" style="background:var(--surface2);border:0"><b>'+N.huddle+' guidelines</b><ul class="rules" style="margin-top:10px">'
        +'<li>'+ic('check')+'<span>Give everyone a chance to speak.</span></li><li>'+ic('check')+'<span>Stay on the feeling of the '+N.huddle+'.</span></li><li>'+ic('x')+'<span>No abusive language.</span></li><li>'+ic('x')+'<span>No harassment or bullying. Be respectful.</span></li></ul></div>'
        +'<label class="check"><input type="checkbox" id="mAgree"> I understand and accept the guidelines</label>'
        +'<button class="btn block" id="mGo" data-a="confirmStart" disabled>Start '+N.huddle+'</button>';
    }else if(M.type==='wait'){
      var w=R?R.people.filter(function(p){return p.role==='listener'&&p.hand}):[];
      var free=R?SLOTS-stageCount():0;
      inner='<div class="grab"></div><h3>'+w.length+' on the waitlist</h3><p class="hint">'+free+' of '+SLOTS+' seats open on the stage.</p>'
        +(w.length?w.map(function(p){return '<div class="person"><span class="av av'+p.av+'">'+esc(p.name.charAt(0))+'</span><div class="info"><b>'+esc(p.name)+'</b></div><button class="btn sm" data-a="allow" data-v="'+p.id+'" '+(free?'':'disabled')+'>Allow</button><button class="btn sm ghost" data-a="decline" data-v="'+p.id+'">Decline</button></div>'}).join(''):'<p class="hint" style="text-align:center;padding:24px 0">No one has raised a hand yet.</p>')
        +'<button class="btn ghost block" data-a="closeModal">Close</button>';
    }else if(M.type==='end'){
      mid=' mid';
      inner='<h3 style="text-align:center">End '+N.huddle+'?</h3><p class="hint" style="text-align:center;font-size:15px">This will end the '+N.huddle+' for everyone. Continue?</p><div class="row" style="gap:10px"><button class="btn ghost" style="flex:1" data-a="closeModal">Keep going</button><button class="btn danger" style="flex:1" data-a="doEnd">End for all</button></div>';
    }
    m.innerHTML='<div class="scrim'+mid+'" data-scrim><div class="sheet" role="dialog" aria-modal="true">'+inner+'</div></div>';
  }
  function checkCreate(){var g=$('mGo'),t=$('mTheme'),a=$('mAgree');if(g)g.disabled=!(t&&t.value&&a&&a.checked)}
  function syncLogin(){
    var a=$('lgPhone'),b=$('lgSend');
    if(a&&b)b.disabled=!/^[6-9]\d{9}$/.test(a.value);
  }
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter')return;
    var t=e.target;
    if(t.id==='lgPhone'){var b=$('lgSend');if(b&&!b.disabled)b.click()}
    else if(t.id==='lgOtp'){var v=$('lgVerify');if(v&&!v.disabled)v.click()}
  });
  document.addEventListener('change',function(e){if(e.target.id==='mTheme'||e.target.id==='mAgree')checkCreate()});
  document.addEventListener('input',function(e){
    if(e.target.id==='lgPhone'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,10);S.login.phone=e.target.value;syncLogin()}
    if(e.target.id==='lgOtp'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);var vb=$('lgVerify');if(vb)vb.disabled=e.target.value.length!==6;var er=$('lgErr');if(er)er.textContent=''}
    if(e.target.id==='hText'){var c=$('hCount');if(c)c.textContent=e.target.value.length+'/300'}
  });

  /* ---------- Helpers ---------- */
  var tt=null;
  function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true},2400)}
  function copy(txt){
    try{navigator.clipboard.writeText(txt).then(function(){toast('Code copied')},function(){toast('Code: '+txt)})}catch(e){toast('Code: '+txt)}
  }

  /* ---------- Events ---------- */
  document.addEventListener('click',function(ev){
    if(ev.target.hasAttribute&&ev.target.hasAttribute('data-scrim')){S.modal=null;renderModal();return}
    var t=ev.target.closest('[data-a]');if(!t)return;
    var a=t.dataset.a,v=t.dataset.v;
    switch(a){
      case 'sendOtp':
        var ph=$('lgPhone').value;
        if(!/^[6-9]\d{9}$/.test(ph)){toast('Enter a valid 10-digit mobile number');break}
        S.login={step:'otp',phone:ph};render();var oi=$('lgOtp');if(oi)oi.focus();toast('Code sent. Prototype code: 123456');break;
      case 'verify':
        if($('lgOtp').value==='123456'){S.phone=S.login.phone;S.authed=true;render()}
        else{$('lgErr').textContent='That code is not right. Try again.'}
        break;
      case 'changeNum':S.login.step='phone';render();break;
      case 'resend':toast('Code sent again. Prototype code: 123456');break;
      case 'logout':S.authed=false;S.phone='';S.login={step:'phone',phone:''};S.sub=null;S.tab='home';if(location.hash!=='#home')location.hash='home';render();break;
      case 'tab':if(location.hash.replace('#','')===v)route();else location.hash=v;break;
      case 'htab':S.home=v;render();break;
      case 'next':S.spark++;render();break;
      case 'circle':S.circle[v]=S.circle[v]?0:1;toast(S.circle[v]?'Added to '+N.circle:'Removed from '+N.circle);render();break;
      case 'call':var q=v.split(':');startCall(q[0],q[1]);break;
      case 'shop':S.tab='profile';S.sub='shop';render();window.scrollTo(0,0);break;
      case 'sub':S.sub=v;render();window.scrollTo(0,0);break;
      case 'back':S.sub=null;render();break;
      case 'buy':var pk=PACKS[+v];S.hearts+=pk[0];S.tx.unshift({t:'Bought '+pk[0]+' '+N.hearts,a:pk[0],w:'Just now'});toast(pk[0]+' '+N.hearts+' added');render();break;
      case 'copyref':copy('FEEL-2048');break;
      case 'role':
        S.role=v;render();
        if(v==='member'){var un=S.tickets.filter(function(x){return x.who==='me'&&x.st==='resolved'&&!x.seen}).length;if(un)toast('The FeelRight team replied to your ticket')}
        break;
      case 'raise':S.preKind=v;S.tab='profile';S.sub='help';render();window.scrollTo(0,0);break;
      case 'resolve':
        var rp=v.split(':'),tk=S.tickets.filter(function(x){return x.id===rp[0]})[0],ok=rp[1]==='1',mg=$('msg-'+rp[0]);
        if(!tk)break;
        if(!mg.value.trim()){toast('Write a message for the member first');mg.focus();break}
        tk.st='resolved';tk.res={ok:ok,msg:mg.value.trim()};tk.seen=tk.who!=='me'?true:false;
        if(ok&&tk.kind!=='other'){
          if(tk.who==='me'){S.perm[tk.kind]=true;if(tk.kind==='host')S.hosts.push('me')}
          else if(tk.kind==='host')S.hosts.push(tk.who);
        }
        toast('Ticket resolved');render();break;
      case 'publishEcho':
        var et=$('echoTitle').value.trim();
        if(!et){toast('Add a title first');$('echoTitle').focus();break}
        ECHOES.push({t:et,feel:$('echoFeel').value,c:'Stories',d:240+rnd(300),av:6,by:'You'});toast(N.echo+' published');render();break;
      case 'startHuddle':S.modal={type:'create'};renderModal();break;
      case 'confirmStart':
        var th=$('mTheme').value,ti=$('mTitle').value.trim()||th;
        var nh={id:'m'+Date.now(),theme:th,title:ti,host:'You',av:6,count:1,mine:true};
        S.huddles.unshift(nh);S.modal=null;renderModal();openHuddle(nh);render();break;
      case 'join':openHuddle(huddleOf(v));break;
      case 'endh':endHuddle(v);break;
      case 'closeModal':S.modal=null;renderModal();break;
      case 'min':if(R){R.min=true;$('room').hidden=true;renderMini();render()}break;
      case 'leave':leaveHuddle();break;
      case 'askEnd':S.modal={type:'end'};renderModal();break;
      case 'doEnd':if(R)endHuddle(R.h.id);break;
      case 'wait':S.modal={type:'wait'};renderModal();break;
      case 'allow':var pa=pOf(v);if(pa&&stageCount()<SLOTS){pa.role='speaker';pa.muted=false;pa.hand=false}renderModal();renderRoom();break;
      case 'decline':var pd=pOf(v);if(pd)pd.hand=false;renderModal();renderRoom();break;
      case 'hand':raiseHand();break;
      case 'mic':var y=you();if(y&&y.role!=='listener'){y.muted=!y.muted;renderRoom()}break;
      case 'vol':R.vol=!R.vol;renderRoom();toast(R.vol?'Audio on':'Audio muted');break;
      case 'mute':var pm=pOf(v);if(pm){pm.muted=!pm.muted;renderRoom()}break;
      case 'down':var pw=pOf(v);if(pw){pw.role='listener';pw.muted=true;renderRoom()}break;
      case 'kick':var pk2=pOf(v);if(pk2){R.people.splice(R.people.indexOf(pk2),1);R.h.count=R.people.length;renderRoom();toast(pk2.name+' removed')}break;
      case 'gift':
        var g=GIFTS[+v];
        if(spend(g[2],'Gift '+g[0]+' '+g[1])){toast('You sent '+g[0]+' '+g[1]+' · -'+g[2]+' '+N.hearts)}
        else toast('Not enough '+N.hearts);
        break;
      case 'play':
        var k=+v;
        if(S.cur===k&&S.playing)setPlaying(false);
        else{if(R||S.call){toast('Finish your '+(S.call?'call':N.huddle)+' first');break}if(S.cur!==k){S.cur=k;S.pos=0}setPlaying(true)}
        break;
      case 'toggle':setPlaying(!S.playing);break;
      case 'skip':var e=ECHOES[S.cur];S.pos=Math.min(e.d-1,Math.max(0,S.pos+ +v));tickMini();break;
      case 'speed':S.speed=S.speed===1?1.5:S.speed===1.5?2:1;renderMini();break;
      case 'ef':S.ef=v;render();break;
      case 'tk':S.tk=v;render();break;
      case 'submitHelp':
        var ty=$('hType'),tx=$('hText');
        if(!ty.value){toast('Select an issue type');ty.focus();break}
        if(!tx.value.trim()){toast('Tell the team what you need');tx.focus();break}
        var is=ISSUES[+ty.value];
        if(is[1]!=='other'&&S.perm[is[1]]){toast('You already have this access');break}
        if(is[1]!=='other'&&myTicket(is[1],'active')){toast('You already have an open ticket for this');break}
        S.tickets.push({id:'t'+Date.now(),who:'me',kind:is[1],type:is[0],text:tx.value.trim(),st:'active',res:null,seen:true});
        S.tk='active';toast('Ticket sent to the FeelRight team');render();break;
      case 'toast':toast(v);break;
    }
  });

  function route(){
    var h=location.hash.replace('#','');
    S.tab=h==='huddles'?'huddles':h==='echoes'?'echoes':h==='profile'?'profile':'home';
    S.sub=null;render();window.scrollTo(0,0);
  }
  window.addEventListener('hashchange',route);
  route();
})();
</script>

</body></html>
